<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sabu</title>
  <meta name="description" content="Sabu's projects, loaded into a six-disc player.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#140e0b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen&family=Geist:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="style.css?v=202610132209">
</head>
<body>
  <canvas class="sky" id="sky" aria-hidden="true"></canvas>
  <div class="room">
    <header class="top">
      <a class="mark" href="./">Sabu</a>
      <div class="theme-switch" id="theme-switch" role="radiogroup" aria-label="Theme" style="--n: 2">
        <input type="radio" name="theme" id="theme-room" value="room" checked>
        <label for="theme-room">Room</label>
        <input type="radio" name="theme" id="theme-space" value="space">
        <label for="theme-space">Space</label>
        <span class="theme-knob" aria-hidden="true"></span>
      </div>
      <a class="gh" href="https://github.com/windowopner" target="_blank" rel="noopener"><i class="ph ph-github-logo" aria-hidden="true"></i>GitHub</a>
    </header>

    <main class="player" aria-label="Project player">
      <div class="deck" id="deck">
        <div class="glass">
          <canvas class="orbit orbit-back" id="orbit-back" aria-hidden="true"></canvas>
          <canvas class="orbit orbit-front" id="orbit-front" aria-hidden="true"></canvas>
          <ol class="discs" id="discs" aria-label="Projects"></ol>
          <div class="clamp" id="clamp" aria-hidden="true"><span class="head"><span class="arm"></span><span class="puck"></span></span></div>
        </div>
        <div class="nameplate" aria-hidden="true"><span>SABU</span><span>6 DISC</span></div>
      </div>

      <section class="console" aria-label="Now playing">
        <div class="stage" id="stage-wrap"><canvas id="stage" width="100" height="100" aria-hidden="true"></canvas></div>

        <div class="readout">
          <div class="vfd" aria-live="polite">
            <div class="vfd-row">
              <span class="track" id="track">01</span>
              <span class="title" id="title"></span>
            </div>
            <div class="vfd-row vfd-sub">
              <span id="kind"></span>
              <ol class="slots" id="slots" aria-hidden="true"></ol>
            </div>
          </div>
          <p class="desc" id="desc"></p>
          <p class="stack" id="stack"></p>
        </div>

        <div class="controls" id="controls">
          <div class="hatch" id="hatch" inert>
            <div class="keypad" role="group" aria-label="Password keypad">
              <div class="pad-vfd" aria-live="polite"><span id="pad-disc">Disc 01</span><span id="pad-code">------</span></div>
              <div class="pad-grid">
              <button class="pad-key" type="button" data-k="1">1</button>
              <button class="pad-key" type="button" data-k="2">2</button>
              <button class="pad-key" type="button" data-k="3">3</button>
              <button class="pad-key" type="button" data-k="4">4</button>
              <button class="pad-key" type="button" data-k="5">5</button>
              <button class="pad-key" type="button" data-k="6">6</button>
              <button class="pad-key" type="button" data-k="7">7</button>
              <button class="pad-key" type="button" data-k="8">8</button>
              <button class="pad-key" type="button" data-k="9">9</button>
              <button class="pad-key pad-fn" type="button" data-k="C" aria-label="Clear">C</button>
              <button class="pad-key" type="button" data-k="0">0</button>
              <button class="pad-key pad-fn" type="button" data-k="OK" disabled aria-label="Unlock, turned off for now">OK</button>
              </div>
            </div>
            <span class="door door-l" aria-hidden="true"></span>
            <span class="door door-r" aria-hidden="true"></span>
          </div>

          <div class="keys">
            <div class="key-wrap">
              <button class="key" id="prev" type="button" aria-label="Previous disc"><i class="ph ph-caret-left" aria-hidden="true"></i></button>
              <span class="engrave" aria-hidden="true">Prev</span>
            </div>
            <div class="key-wrap">
              <button class="key" id="next" type="button" aria-label="Next disc"><i class="ph ph-caret-right" aria-hidden="true"></i></button>
              <span class="engrave" aria-hidden="true">Next</span>
            </div>
            <div class="key-wrap">
              <button class="key key-play" id="play" type="button"><i class="ph ph-play" aria-hidden="true"></i></button>
              <span class="sticker" id="sticker" aria-hidden="true"><i class="ph-fill ph-lock-simple"></i></span>
              <span class="engrave" id="play-label" aria-hidden="true">Play</span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="bottom">
      <p>RAS G9. <span class="hint-desk">Scroll, use the arrow keys, or press 1 to 6 to change disc.</span><span class="hint-touch">Swipe the discs or tap one to change.</span></p>
    </footer>
  </div>

  <div class="vignette" aria-hidden="true"></div>
  <canvas class="film" id="film" aria-hidden="true"></canvas>
  <span class="stamp" id="stamp" aria-hidden="true"></span>

  <noscript>
    <ul class="fallback">
      <li>Disc 1: redacted.</li>
      <li>Undertone: a macOS background that moves with your music.</li>
      <li>Disc 3: redacted.</li>
      <li>Disc 4: redacted.</li>
      <li>Disc 5: redacted.</li>
      <li>Disc 6: redacted.</li>
    </ul>
  </noscript>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
  <script src="icons.js?v=202610132209" defer></script>
  <script src="film.js?v=202610132209" defer></script>
  <script src="orbit.js?v=202610132209" defer></script>
  <script src="app.js?v=202610132209" defer></script>
</body>
</html>
